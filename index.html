<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galaxy Alien Shooter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial;
    touch-action: none; 
}

canvas{
    display:block;
}

#startScreen{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,#020111,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:200;
}

#startScreen h1{
    color:cyan;
    font-size: clamp(40px, 10vw, 80px); 
    margin-bottom:30px;
    text-align: center;
}

#startBtn{
    padding:18px 45px;
    font-size: clamp(20px, 5vw, 28px);
    border:none;
    border-radius:12px;
    background:lime;
    color:black;
    cursor:pointer;
    font-weight:bold;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    z-index:10;
    font-size: clamp(16px, 4vw, 22px);
    line-height:1.6;
}

.high-score-text {
    color: yellow;
    font-weight: bold;
}

#gameOver{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

#gameOver h1{
    color:red;
    font-size: clamp(40px, 10vw, 70px);
}

#restartBtn{
    margin-top:20px;
    padding:14px 35px;
    border:none;
    border-radius:10px;
    background:cyan;
    font-size:22px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>
<body>

<div id="startScreen">
    <h1>GALAXY WAR</h1>
    <button id="startBtn">START GAME</button>
</div>

<div id="ui">
    Score: <span id="score">0</span><br>
    <span class="high-score-text">High Score: <span id="highScore">0</span></span><br>
    Level: <span id="level">1</span><br>
    Health: <span id="health">100</span>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <h2 style="color: yellow; margin-top: 10px; font-size: clamp(20px, 6vw, 30px);">Your Score: <span id="finalScore">0</span></h2>
    <button id="restartBtn" onclick="location.reload()">
        RESTART
    </button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false }); // Performance boost: Alpha false for solid background

canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener('resize', () => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    updateBgGradient();
});

let gameStarted = false;
let gameEnded = false;
let score = 0;
let highScore = localStorage.getItem("galaxyHighScore") || 0; 
let level = 1;
let health = 100;

const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("highScore");
const levelEl = document.getElementById("level");
const healthEl = document.getElementById("health");
const finalScoreEl = document.getElementById("finalScore");

highScoreEl.innerText = highScore;

const bullets = [];
const aliens = [];
const enemyBullets = [];
const particles = [];
const medkits = [];
const stars = [];
let boss = null;
let bgGradient;

function updateBgGradient() {
    bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGradient.addColorStop(0, "#020111");
    bgGradient.addColorStop(1, "black");
}
updateBgGradient();

// Reduced stars for better mobile performance
for(let i=0; i<100; i++){
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 2
    });
}

const player = {
    x: canvas.width/2 - 35,
    y: canvas.height-120,
    w: 70,
    h: 90,
    speed: 8
};

const keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

canvas.addEventListener("touchmove", (e) => {
    if(!gameStarted || gameEnded) return;
    const touch = e.touches[0];
    player.x = touch.clientX - player.w/2;
    player.y = touch.clientY - player.h/2;

    if(player.x < 0) player.x = 0;
    if(player.x + player.w > canvas.width) player.x = canvas.width - player.w;
    if(player.y < 0) player.y = 0;
    if(player.y + player.h > canvas.height) player.y = canvas.height - player.h;
}, {passive: false});

canvas.addEventListener("touchstart", (e) => {
    if(!gameStarted || gameEnded) return;
    const touch = e.touches[0];
    player.x = touch.clientX - player.w/2;
    player.y = touch.clientY - player.h/2;
}, {passive: false});

document.getElementById("startBtn").onclick = () => {
    gameStarted = true;
    document.getElementById("startScreen").style.display = "none";
};

function shoot(){
    bullets.push({
        x: player.x + player.w/2 - 4,
        y: player.y,
        w: 8,
        h: 25,
        speed: 14
    });
}

setInterval(() => {
    if(gameStarted && !gameEnded) shoot();
}, 180);

function spawnAlien(){
    const type = Math.floor(Math.random()*3);
    if(type===0){
        aliens.push({type:"normal", x:Math.random()*(canvas.width-60), y:-100, w:60, h:60, hp:2, speed:3, color:"#8a2be2"});
    } else if(type===1){
        aliens.push({type:"fast", x:Math.random()*(canvas.width-40), y:-100, w:40, h:40, hp:1, speed:6, color:"red"});
    } else {
        aliens.push({type:"tank", x:Math.random()*(canvas.width-90), y:-100, w:90, h:90, hp:6, speed:2, color:"orange"});
    }
}

setInterval(() => {
    if(gameStarted && !gameEnded) spawnAlien();
}, 700);

function spawnBoss(){
    boss = {
        x: canvas.width/2 - 150,
        y: 60,
        w: Math.min(300, canvas.width - 20), 
        h: 170,
        hp: 200,
        maxHp: 200,
        dir: 5,
        shootTimer: 0
    };
    if (boss.x < 0) boss.x = 10;
}

function explosion(x, y, color){
    // Reduced particle count for performance
    for(let i=0; i<15; i++){
        particles.push({
            x, y,
            size: Math.random()*4 + 1,
            color,
            vx: (Math.random()-0.5)*10,
            vy: (Math.random()-0.5)*10,
            life: 30
        });
    }
}

function drawBackground(){
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    for(let s of stars){
        ctx.fillRect(s.x, s.y, s.size, s.size); // Changed arc to fillRect for faster rendering
        s.y += s.speed;
        if(s.y > canvas.height){
            s.y = 0;
            s.x = Math.random()*canvas.width;
        }
    }
}

function drawPlayer(){
    ctx.fillStyle = "#00eaff";
    ctx.beginPath();
    ctx.moveTo(player.x+35, player.y);
    ctx.lineTo(player.x+70, player.y+90);
    ctx.lineTo(player.x, player.y+90);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(player.x+35, player.y+30, 10, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.moveTo(player.x+20, player.y+90);
    ctx.lineTo(player.x+35, player.y+120+Math.random()*10);
    ctx.lineTo(player.x+50, player.y+90);
    ctx.fill();
}

function movePlayer(){
    if(keys["a"] || keys["ArrowLeft"]) player.x -= player.speed;
    if(keys["d"] || keys["ArrowRight"]) player.x += player.speed;
    if(keys["w"] || keys["ArrowUp"]) player.y -= player.speed;
    if(keys["s"] || keys["ArrowDown"]) player.y += player.speed;

    if(player.x < 0) player.x = 0;
    if(player.x + player.w > canvas.width) player.x = canvas.width-player.w;
    if(player.y < 0) player.y = 0;
    if(player.y + player.h > canvas.height) player.y = canvas.height-player.h;
}

function drawBullets(){
    ctx.fillStyle = "lime";
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        ctx.fillRect(b.x, b.y, b.w, b.h);
        b.y -= b.speed;
        if(b.y < -50) bullets.splice(i, 1);
    }
}

function drawAliens(){
    for (let i = aliens.length - 1; i >= 0; i--) {
        let a = aliens[i];
        
        ctx.fillStyle = a.color;
        ctx.fillRect(a.x, a.y, a.w, a.h); // Use rects instead of arcs for faster rendering

        ctx.fillStyle = "black";
        ctx.fillRect(a.x+10, a.y+15, 10, 10); // Left eye
        ctx.fillRect(a.x+a.w-20, a.y+15, 10, 10); // Right eye

        a.y += a.speed;

        if(Math.random() < 0.008){
            enemyBullets.push({x: a.x+a.w/2 - 4, y: a.y+a.h, w: 8, h: 20, speed: 7, color: a.color});
        }

        if(a.x < player.x + player.w && a.x + a.w > player.x && a.y < player.y + player.h && a.y + a.h > player.y){
            health -= 15;
            explosion(player.x, player.y, "red");
            aliens.splice(i, 1);
            continue;
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if(b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y){
                a.hp--;
                bullets.splice(j, 1);
                explosion(b.x, b.y, "yellow");

                if(a.hp <= 0){
                    score += 10;
                    if(score > highScore) {
                        highScore = score;
                        highScoreEl.innerText = highScore;
                        localStorage.setItem("galaxyHighScore", highScore);
                    }
                    explosion(a.x, a.y, a.color);

                    if(Math.random() < 0.20) medkits.push({x: a.x, y: a.y, size: 30});
                    
                    aliens.splice(i, 1);
                    if(score > 0 && score % 150 === 0) level++;
                    if(level === 5 && !boss) spawnBoss();
                    break;
                }
            }
        }
    }
}

function drawBoss(){
    if(!boss) return;

    ctx.fillStyle = "#ff00ff";
    ctx.beginPath();
    let bHalf = boss.w / 2;
    ctx.moveTo(boss.x + bHalf, boss.y);
    ctx.lineTo(boss.x + boss.w, boss.y + 100);
    ctx.lineTo(boss.x + boss.w - 60, boss.y + 170);
    ctx.lineTo(boss.x + 60, boss.y + 170);
    ctx.lineTo(boss.x, boss.y + 100);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "red";
    ctx.fillRect(boss.x + bHalf - 70, boss.y + 60, 20, 20); // Left eye
    ctx.fillRect(boss.x + bHalf + 50, boss.y + 60, 20, 20); // Right eye

    boss.x += boss.dir;
    if(boss.x < 0 || boss.x + boss.w > canvas.width) boss.dir *= -1;

    boss.shootTimer++;
    if(boss.shootTimer > 20){
        enemyBullets.push({x: boss.x+boss.w/2 - 7, y: boss.y+boss.h, w: 14, h: 35, speed: 10, color: "magenta"});
        boss.shootTimer = 0;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        if(b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y){
            bullets.splice(i, 1);
            boss.hp--;
            explosion(b.x, b.y, "pink");
        }
    }

    if(boss.hp <= 0){
        explosion(boss.x+boss.w/2, boss.y+80, "purple");
        score += 500;
        if(score > highScore) {
            highScore = score;
            highScoreEl.innerText = highScore;
            localStorage.setItem("galaxyHighScore", highScore);
        }
        boss = null;
        level++;
    }

    let barWidth = Math.min(400, canvas.width - 40);
    let barX = canvas.width/2 - barWidth/2;
    ctx.fillStyle = "white";
    ctx.fillRect(barX, 20, barWidth, 20);
    ctx.fillStyle = "red";
    ctx.fillRect(barX, 20, (boss.hp/boss.maxHp)*barWidth, 20);
}

function drawEnemyBullets(){
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let b = enemyBullets[i];
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        b.y += b.speed;

        if(b.x < player.x + player.w && b.x + b.w > player.x && b.y < player.y + player.h && b.y + b.h > player.y){
            health -= 10;
            explosion(player.x, player.y, "orange");
            enemyBullets.splice(i, 1);
            continue;
        }
        if(b.y > canvas.height) enemyBullets.splice(i, 1);
    }
}

function drawMedkits(){
    for (let i = medkits.length - 1; i >= 0; i--) {
        let m = medkits[i];
        ctx.fillStyle = "lime";
        ctx.fillRect(m.x, m.y, m.size, m.size);
        ctx.fillStyle = "white";
        ctx.fillRect(m.x+12, m.y+5, 6, 20);
        ctx.fillRect(m.x+5, m.y+12, 20, 6);
        m.y += 3;

        if(m.x < player.x + player.w && m.x + m.size > player.x && m.y < player.y + player.h && m.y + m.size > player.y){
            health += 25;
            if(health > 100) health = 100;
            medkits.splice(i, 1);
            continue;
        }
        if(m.y > canvas.height) medkits.splice(i, 1);
    }
}

function drawParticles(){
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size); // Faster rendering than circles
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function updateUI(){
    scoreEl.innerText = score;
    levelEl.innerText = level;
    healthEl.innerText = health;
}

function checkGameOver(){
    if(health <= 0 && !gameEnded){
        gameEnded = true;
        if(score > highScore) {
            highScore = score;
            localStorage.setItem("galaxyHighScore", highScore);
        }
        finalScoreEl.innerText = score;
        document.getElementById("gameOver").style.display = "flex";
    }
}

function animate(){
    requestAnimationFrame(animate);
    if(!gameStarted) return;
    
    // Performance boost: fill rect instead of clearRect
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height); 

    drawBackground();
    movePlayer();
    drawPlayer();
    drawBullets();
    drawAliens();
    drawBoss();
    drawEnemyBullets();
    drawMedkits();
    drawParticles();
    updateUI();
    checkGameOver();
}

animate();
</script>
</body>
</html>
